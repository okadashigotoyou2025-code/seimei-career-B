<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>キャリア調査ダッシュボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
:root{
  color-scheme:light;
  --bg:#E8F4F8; --card:#FFFFFF; --tx:#1A3040; --mute:#4F6878; --line:#BFD8E3;
  --ac:#2E7D9A; --acsoft:#C8E0EB; --acdeep:#1C5F78;
  --p1:#2E7D9A; --p1s:#D3E8F0; --p2:#3C7F55; --p2s:#D7EBDD; --p3:#A8621C; --p3s:#F3E2CC;
  --low:#B03A3A; --lows:#F6DADA; --warn:#F6E6CF; --warnx:#6B4210; --good:#DCEEDF; --goodx:#285C38;
  --t1:#2E7D9A; --t2:#B4541F; --t3:#3C7F55; --t4:#8A8FA3; --t5:#C9D5DB;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"BIZ UDPGothic","Meiryo UI","Meiryo",sans-serif;font-size:15px;line-height:1.65}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acdeep);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-block:18px 48px;padding-inline:16px;display:flex;flex-direction:column;gap:14px}
header.h{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end}
header.h h1{margin:0;font-size:24px;letter-spacing:.02em}
header.h .sub{color:var(--mute);font-size:14px}
.load{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:auto}
.btn{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:6px 14px;font-size:14px}
.btn.pri{background:var(--acsoft);border-color:var(--ac);color:var(--acdeep);font-weight:700}
.src{font-size:13px;color:var(--mute)}
.banner{background:var(--warn);color:var(--warnx);border-radius:10px;padding:8px 14px;font-size:14px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:14px}
.filters select{border:2px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--card)}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 14px;font-size:15px;color:var(--mute);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--acdeep);font-weight:700;border-bottom-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile .k{font-size:13px;color:var(--mute)}
.tile .v{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
.tile .v small{font-size:14px;color:var(--mute);font-weight:400}
.tile.alert{border-color:var(--low);background:var(--lows)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.panel h2{margin:0 0 4px;font-size:18px}
.panel .note{margin:0 0 10px;color:var(--mute);font-size:13px}
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.stack{display:flex;height:26px;border-radius:6px;overflow:hidden;background:var(--t5)}
.stack span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin-top:8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.kbars{display:flex;flex-direction:column;gap:4px}
.kb{display:grid;grid-template-columns:44px 1fr minmax(90px,150px) 40px;gap:8px;align-items:center;font-size:14px;padding:3px 4px;border-radius:6px;background:none;border:0;text-align:left;width:100%}
.kb:hover{background:var(--bg)}
.kb .id{font-weight:700;font-size:13px;border-radius:5px;text-align:center;padding:1px 0}
.kb .bar{height:14px;background:var(--bg);border-radius:4px;position:relative;overflow:hidden}
.kb .bar i{position:absolute;inset:0 auto 0 0;border-radius:4px}
.kb .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.kb .m{grid-column:2 / 5;font-size:12px;color:var(--mute);margin-top:-4px}
.kb.low .val{color:var(--low)}
.pl-h{font-size:13px;font-weight:700;margin:8px 0 2px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-family:"Meiryo UI","BIZ UDPGothic",sans-serif;font-size:13px}
th{background:#C8E0EB;color:#1C5F78;text-align:left;padding:6px 8px;border:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
td{padding:6px 8px;border:1px solid var(--line);vertical-align:top;background:var(--card)}
td.num{text-align:right;font-variant-numeric:tabular-nums}
td.nw{white-space:nowrap}
.chip{display:inline-block;border-radius:999px;padding:0 8px;font-size:12px;margin:1px 2px;border:1px solid var(--line);background:var(--bg);white-space:nowrap}
.chip.r{background:var(--lows);border-color:#E0A5A5;color:#7A2020;font-weight:700}
.kcard{display:grid;grid-template-columns:120px 1fr;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
@media (max-width:700px){.kcard{grid-template-columns:1fr}}
.kcard .score{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kcard h3{margin:0;font-size:17px}
.kcard .cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px;margin-top:8px}
.kcard .cell{background:var(--bg);border-radius:8px;padding:6px 8px;font-size:13px;white-space:pre-line}
.kcard .cell b{display:block;font-size:12px;color:var(--mute)}
.kcard .cell.empty{color:var(--mute);background:none;border:1px dashed var(--line)}
.sm{font-size:13px;color:var(--mute)}
.mat td{min-width:130px;white-space:pre-line}
.mat td.h{min-width:180px}
.mat td.emp{background:#FBF3F3}
.hint2{font-size:13px;margin-top:6px;background:var(--bg);border-radius:8px;padding:4px 8px}
.howto ol{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px}
.empty-state{text-align:center;padding:30px;color:var(--mute)}
</style>
</head>
<body>

<div class="wrap">
  <header class="h">
    <div><h1>キャリア調査ダッシュボード</h1><div class="sub">キャリアステップ調査 v8 の回答と、マスタの体制一覧表をつなげて見る（先生用）</div></div>
    <div class="load">
      <label class="btn pri" for="file" style="cursor:pointer">Formsの回答Excelを読み込む</label>
      <input type="file" id="file" accept=".xlsx,.csv" hidden>
      <button class="btn" id="sample">サンプルで試す</button>
      <label class="btn" for="mfile" style="cursor:pointer">マスタを読み込む（体制を最新に）</label>
      <input type="file" id="mfile" accept=".xlsx" hidden>
      <span class="src" id="src"></span><span class="src" id="msrc"></span>
    </div>
  </header>
  <div id="banner"></div>
  <div class="filters" id="filters"></div>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-t="all">全体</button>
    <button role="tab" data-t="follow">要フォロー</button>
    <button role="tab" data-t="where">どこを強めるか</button>
    <button role="tab" data-t="taisei">体制一覧表</button>
    <button role="tab" data-t="daicho">取り組み台帳</button>
    <button role="tab" data-t="taiou">アンケート対応表</button>
    <button role="tab" data-t="how">使い方</button>
  </nav>
  <main id="out"></main>
</div>

  // 小項目

    return {id, pillar:o.pillar || '', name:r['生徒向けの名前'] || o.name || id, ask:r['問いかけ'] || '', links:splitK(r['つながり（マップの線）']), official:o.name || '', sugata:o.sugata || '', q:o.q || ''}; });
  const KI = new Set(KIDS.map(k => k.id));
  KIDS.forEach(k => { if(!OFF[k.id]) P.push(`小項目 ${k.id} が「体制一覧表」シートにありません`); if(!k.pillar) P.push(`小項目 ${k.id} の柱が「体制一覧表」で空です`);
    k.links.forEach(x => { if(!KI.has(x)) P.push(`小項目：${k.id} のつながり「${x}」がありません`); }); });
  // コンテンツ
  const CONTENTS = [], ALLIDS = new Set();
  table('コンテンツ').forEach(r => {
    const id = String(r['ID']).trim(); if(!id) return;
    if(ALLIDS.has(id)) P.push(`コンテンツ：ID「${id}」が2回出てきます`); ALLIDS.add(id);
    if(no(r['表示'])) return;
    const kids = splitK(r['小項目']).filter(k => KI.has(k));
    if(!kids.length){ P.push(`コンテンツ ${id}：小項目「${r['小項目']}」が A1〜C5 のどれでもないので、アプリに出ません`); return; }
    if(!/^https?:\/\//.test(String(r['URL'] || ''))) P.push(`コンテンツ ${id}：URLが空か、http で始まっていません`);
    CONTENTS.push({id, title:r['タイトル'] || id, desc:r['ひとこと説明'] || '', kind:r['種類'] || 'サイト', url:r['URL'] || '', state:r['状態'] || '', kids,
      concerns:splitK(r['気になること']), michi:splitK(r['道']).length ? splitK(r['道']) : ['すべて'], nenji:splitK(r['年次']), meyasu:String(r['目安'] || ''),
      bun:r['担当分掌'] || '', dan:parseInt(r['たすけ段階'] || 1) || 1, box:r['資料箱の場所'] || '', write:r['その場で書く問い'] || '', tori:r['体制表の取り組み'] || '',
      links:splitK(r['つながるコンテンツ（ID）']), img:r['見本画像'] || ''});
  });
  const CID = new Set(CONTENTS.map(c => c.id));
  CONTENTS.forEach(c => { c.links = c.links.filter(x => { if(!CID.has(x)){ P.push(`コンテンツ ${c.id}：つながるコンテンツ「${x}」がありません（表示×も含む）`); return false; } return x !== c.id; }); });
  // IDの引き継ぎ（消した・まとめたID → 記録カードの読みかえ）
  const ALIAS = {};
  table('IDの引き継ぎ').forEach((r, i) => { const o = String(r['旧ID']).trim(), to = String(r['引き継ぎ先ID（空欄＝なくなった）'] || '').trim();
    if(!/^c\d+$/.test(o)) return;
    if(ALLIDS.has(o)) P.push(`IDの引き継ぎ：${o} はまだ「コンテンツ」シートにあります（消したIDだけ書く）`);
    if(to && !ALLIDS.has(to)) P.push(`IDの引き継ぎ：${o} の引き継ぎ先「${to}」が「コンテンツ」シートにありません`);
    ALIAS[o] = {to, title:r['旧タイトル'] || '', kids:splitK(r['旧小項目'])}; });
  const fix = id => { let x = id, n = 0; while(ALIAS[x] && ALIAS[x].to && n++ < 9) x = ALIAS[x].to; return x; };
  // マップ（問いの木）
  const TREE = [];
  rowsOf('マップ（問い）').slice(2).forEach((r, i) => {
    const big = String(r[0] || '').trim(), sub = String(r[1] || '').trim(); let id = String(r[3] || '').trim();
    if(!big && !sub && !id) return;
    if(!big || !sub){ P.push(`マップ（問い） ${i + 3}行目：大きな問いと具体的な問いの両方を書いてください`); return; }
    let b = TREE.find(x => x.q === big); if(!b){ b = {q:big, subs:[]}; TREE.push(b); }
    let s2 = b.subs.find(x => x.q === sub); if(!s2){ s2 = {q:sub, ids:[]}; b.subs.push(s2); }
    if(!id) return;
    if(!ALLIDS.has(id) && ALIAS[id]){ id = fix(id); if(!id) return; }
    if(!ALLIDS.has(id)){ P.push(`マップ（問い） ${i + 3}行目：ID「${id}」が「コンテンツ」シートにありません`); return; }
    if(!CID.has(id)) return;
    s2.ids.push([parseInt(r[2]) || 99, id]);
  });
  TREE.forEach(b => b.subs.forEach(s2 => { s2.ids = s2.ids.sort((a, c) => a[0] - c[0]).map(x => x[1]).filter((v, i, a) => a.indexOf(v) === i); }));
  TREE.forEach(b => { b.subs = b.subs.filter(s2 => { if(!s2.ids.length) P.push(`マップ（問い）：「${b.q} → ${s2.q}」にコンテンツが1つもありません`); return s2.ids.length; }); });
  const inTree = new Set(TREE.flatMap(b => b.subs.flatMap(s2 => s2.ids)));
  CONTENTS.forEach(c => { if(!inTree.has(c.id)) P.push(`コンテンツ ${c.id}（${c.title}）が「マップ（問い）」のどこにも入っていません（マップに出ません）`); });
  KIDS.forEach(k => { if(!CONTENTS.some(c => c.kids.includes(k.id))) P.push(`小項目 ${k.id}（${k.name}）に、表示するコンテンツが1つもありません`); });
  const tn = new Set(DAICHO.map(d => d.name));
  // いまの自分・気になること
  const STATUS = table('いまの自分').map(r => ({no:String(r['番号']).trim(), label:r['選択肢（設問17と同文）'] || r['選択肢（設問20と同文）'], msg:r['ひとこと'] || '', kids:[]}));
  const CONCERNS = table('気になること').filter(r => !no(r['表示'])).map(r => r['表示名']);
  CONTENTS.forEach(c => { if(c.tori && !tn.has(c.tori)) P.push(`コンテンツ ${c.id}：体制表の取り組み「${c.tori}」が「取り組み台帳」にありません`);
    c.concerns.forEach(x => { if(!CONCERNS.includes(x)) P.push(`コンテンツ ${c.id}：気になること「${x}」が「気になること」シートにありません`); }); });
  // 分岐一覧 → routes["道|番号|気になること"] = [ID…]
  const MI = {'大学・短大':'大学','専門学校':'専門','就職':'就職'};
  const ROUTES = {};
  rowsOf('分岐一覧').slice(2).forEach((r, i) => {
    if(!r[0]) return;
    const key = `${MI[String(r[0]).trim()] ?? ''}|${String(r[1]).trim().charAt(0)}|${String(r[2]).trim() === 'とくにない' ? 'none' : String(r[2]).trim()}`;
    const id = String(r[4] || '').trim(); const rank = parseInt(r[3]) || 99;
    (ROUTES[key] = ROUTES[key] || []);
    if(!id) return;
    if(!ALLIDS.has(id) && ALIAS[id]){ const t2 = fix(id); P.push(`分岐一覧 ${i + 3}行目：${id} はなくなったID${t2 !== id ? `（${t2} を出します）` : ''}。IDを選び直してください`); if(t2 === id) return; ROUTES[key].push([rank, t2]); return; }
    if(!ALLIDS.has(id)){ P.push(`分岐一覧 ${i + 3}行目：ID「${id}」が「コンテンツ」シートにありません`); return; }
    if(!CID.has(id)) return; // 表示×
    ROUTES[key].push([rank, id]);
  });
  Object.keys(ROUTES).forEach(k => { ROUTES[k] = ROUTES[k].sort((a, b) => a[0] - b[0]).map(x => x[1]).filter((v, i, a) => a.indexOf(v) === i);
    if(!ROUTES[k].length) P.push(`分岐一覧：「${k.replace(/\|/g,' × ').replace(/^ × /,'未定 × ')}」におすすめが1つもありません`); });
  STATUS.forEach(s => { const ids = ROUTES[`|${s.no}|none`] || []; s.kids = [...new Set(ids.map(id => (CONTENTS.find(c => c.id === id) || {kids:[]}).kids[0]).filter(Boolean))]; });
  const NOTICES = table('時期のおしらせ').map(r => ({nenji:splitK(r['年次']), from:parseInt(r['開始月']), to:parseInt(r['終了月']), michi:splitK(r['道']).length ? splitK(r['道']) : ['すべて'], title:r['タイトル'], body:r['内容'] || '', rel:splitK(r['関連コンテンツ'])}));
  NOTICES.forEach(n => n.rel.forEach(x => { if(!ALLIDS.has(x)) P.push(`時期のおしらせ「${n.title}」の関連コンテンツ「${x}」がありません`); }));
  const SOUDAN = table('相談先').map(r => ({id:r['ID'], name:r['名前'], what:r['何を相談できるか'], where:r['学内／学外'] || '学内', url:r['連絡・URL'] || ''}));
  const WORDS = table('ことば').map(r => ({w:r['語'], y:r['よみ'] || '', d:r['やさしい説明'] || ''}));
  const SET = Object.fromEntries(table('設定').map(r => [r['項目'], r['値']]));
  return {P, D:{v:SET['版'] || 'v8', kids:KIDS, contents:CONTENTS, tree:TREE, alias:ALIAS, status:STATUS, concerns:CONCERNS, routes:ROUTES, notices:NOTICES, soudan:SOUDAN, words:WORDS, set:SET,
    taisei:{bunsho:BUN, rows:TROWS, daicho:DAICHO, taiou:TAIOU}}};
}

      q1: g === 'M' ? (y === '3卒' ? '３卒M年次' : '４卒M年次') : g + '年次', q3: String(1 + Math.floor(r() * 4)), q4: String(1 + (id % 30)), q5:'サンプル生徒 ' + String(id).padStart(3,'0'), _name:'サンプル生徒 ' + String(id).padStart(3,'0'),
      q6:pick(['大学（私立・文系）','専門学校','就職','進学か就職かで迷っている','まだ決めていない']),
      q11:lik(st <= 2 ? .75 : .45), q12:lik(st === 1 ? .45 : .3), q13:lik(.5), q15: aite.length ? aite.join(';') : '誰にも話していない',
      q16:pick(['よく話し合っている','ときどき話し合っている','ときどき話し合っている','あまり話し合っていない','ほとんど話し合っていない']),
      q18: exp.length ? exp.join(';') : 'どれもない', q19:lik(st <= 2 ? .7 : .35), q20, q21:pick(['いつもそうしている','時々そうしている','時々そうしている','していない']),
      q22: r() < .4 ? '入試の仕組み（総合型・推薦・一般）' : '', q23: r() < .45 ? '学費がどれくらいかかるか;奨学金のこと' : '', q24: r() < .3 ? '勉強のやり方が分からない' : '',
      q29: r() < .8 ? pick(['オープンキャンパスに行く','奨学金を調べる','担任と話す','好きなことを書き出す']) : '',
    }); } });
  COLS = Object.fromEntries(Object.keys(Q).map(k => [k, k]));
  SRC = 'サンプル（架空の生徒 148人）'; IS_SAMPLE = true;
}

/* ---------- 集計 ---------- */
function prep(){
  return RAW.map(s => {
    const o = Object.assign({}, s);
    o.g = NENJI(String(s.q1||'').replace(/^[３3４4]卒/, '')); const q1 = String(s.q1||''); o.y = /[３3]卒/.test(q1) ? '3卒' : /[４4]卒/.test(q1) ? '4卒' : (String(s.q2||'').replace(/[^0-9]/g,'') ? String(s.q2).replace(/[^0-9]/g,'') + '年目' : '');
    o.st = ST(s.q20);
    const needs = ['q22','q23','q24'].some(k => ANY(s[k]));
    o.drop = !needs && !String(s.q29||'').trim();
    o.type = o.st === 1 && POS(s.q12) ? '消極決定型' : (o.st === 1 || o.st === 2) && POS(s.q11) && POS(s.q19) ? '納得達成型'
           : (o.st === 2 || o.st === 3) && /いつも|時々/.test(String(s.q21||'')) ? '探索型' : (o.st === 4 || o.st === 5) ? '未着手・停滞型' : '判定外';
    o.reasons = [];
    if(o.st === 5) o.reasons.push('うまく考えられない');
    if(HAS(s.q15, '誰にも話していない')) o.reasons.push('誰にも話していない');
    return o;
  });
}
function filtered(all){ return all.filter(s => !s.drop && (!F.nenji || s.g === F.nenji) && (!F.nen || s.y === F.nen) && (!F.cls || String(s.q3) === F.cls)); }
const pct = (arr, f) => { const v = arr.filter(x => x !== null && x !== undefined); if(!v.length) return null; return Math.round(v.filter(f).length / v.length * 100); };
function has(k){ return !!COLS[k] && RAW.some(s => String(s[k]||'').trim()); }
function scores(S){
  const col = k => S.map(s => (String(s[k]||'').trim() ? s[k] : null));
  const avg = (...xs) => { const v = xs.filter(x => x !== null); return v.length ? Math.round(v.reduce((a,b) => a + b, 0) / v.length) : null; };
  return {
    A1:{v:pct(col('q11'), POS), how:'設問10「本当に興味があるから」に肯定'},
    A2:{v:pct(col('q13'), POS), how:'設問12「好き・得意を説明できる」に肯定'},
    A3:{v:null, how:'v8の調査に項目なし（面談・授業の様子で見る）'},
    A4:{v:null, how:'v8の調査に項目なし（面談・教育相談部との共有で見る）'},
    B1:{v:null, how:'v8の調査に項目なし（設問13で担任・先生の選択も参考に）'},
    B2:{v:pct(S, s => SCHOOL_EXP.some(e => HAS(s.q18, e))), how:'設問15で学校の外の人と出会う経験が1つ以上（アルバイト・資格は除く）'},
    B3:{v:pct(S, s => HAS(s.q15,'友達') || HAS(s.q15,'先輩・卒業生')), how:'設問13で友達・先輩に話したことがある'},
    B4:{v:pct(S, s => !HAS(s.q15,'誰にも話していない')), how:'設問13で「誰にも話していない」以外'},
    B5:{v:pct(col('q16'), v => /よく|ときどき/.test(v)), how:'設問14で「よく・ときどき話し合っている」'},
    C1:{v:pct(S, s => !ANY(s.q22)), how:'設問19「進路の情報」の困りごとがない割合（「正しい理解」の代わりの目安）'},
    C2:{v:pct(S, s => !ANY(s.q23)), how:'設問20「お金」の困りごとがない割合'},
    C3:{v:pct(S, s => TRY_EXP.some(e => HAS(s.q18, e))), how:'設問15で見学・体験を1つ以上'},
    C4:{v:pct(col('q19'), POS), how:'設問16「納得している」に肯定'},
    C5:{v:pct(col('q21'), v => /いつも|時々/.test(v)), how:'設問18「何をすればいいか考えている」で「いつも・時々」'},
  };
}

/* ---------- 描画 ---------- */
const TYPES = [['納得達成型','var(--t1)'],['消極決定型','var(--t2)'],['探索型','var(--t3)'],['未着手・停滞型','var(--t4)'],['判定外','var(--t5)']];
function stackBar(S){
  const n = S.length || 1;
  return `<div class="stack">${TYPES.map(([t,c]) => { const k = S.filter(s => s.type === t).length; return k ? `<span title="${t} ${k}人" style="width:${k/n*100}%;background:${c}"></span>` : ''; }).join('')}</div>`;
}
function draw(){
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.t === TAB));
  $('#src').textContent = SRC ? '読み込み中：' + SRC : '';
  $('#banner').innerHTML = IS_SAMPLE ? '<div class="banner">いま表示しているのはサンプル（架空のデータ）です。実際の結果ではありません。</div>' : '';
  $('#msrc').textContent = '体制：' + MSRC;
  if(TAB === 'taisei'){ $('#filters').innerHTML = ''; $('#out').innerHTML = viewTaisei(); return; }
  if(TAB === 'daicho'){ $('#filters').innerHTML = ''; $('#out').innerHTML = viewDaicho(); return; }
  if(TAB === 'taiou'){ $('#filters').innerHTML = ''; $('#out').innerHTML = viewTaiou(); return; }
  if(TAB === 'how'){ $('#filters').innerHTML = ''; $('#out').innerHTML = viewHow(); return; }
  if(!RAW.length){ $('#filters').innerHTML = ''; $('#out').innerHTML = `<div class="panel empty-state"><p>Formsの「応答をExcelで開く」で保存したファイルを読み込んでください。</p><p>まず見てみたいときは「サンプルで試す」を押してください。</p><p class="sm">回答はこのブラウザの中だけで処理します。どこにも送りません。</p></div>`; return; }
  const all = prep();
  const cls = [...new Set(all.map(s => String(s.q3||'')).filter(Boolean))].sort();
  $('#filters').innerHTML = `<label>年次 <select data-f="nenji"><option value="">すべて</option>${['F','M','S','G'].map(g => `<option ${F.nenji===g?'selected':''}>${g}</option>`).join('')}</select></label>
    <label>区分 <select data-f="nen"><option value="">すべて</option>${[...new Set(all.map(s => s.y).filter(Boolean))].sort().map(y => `<option value="${esc(y)}" ${F.nen===y?'selected':''}>${esc(y === '3卒' ? '３卒M' : y === '4卒' ? '４卒M' : y)}</option>`).join('')}</select></label>
    <label>クラス <select data-f="cls"><option value="">すべて</option>${cls.map(c => `<option ${F.cls===c?'selected':''}>${esc(c)}</option>`).join('')}</select></label>`;
  const S = filtered(all);
  const out = $('#out');
  if(TAB === 'all') out.innerHTML = viewAll(all, S);
  if(TAB === 'follow') out.innerHTML = viewFollow(S);
  if(TAB === 'where') out.innerHTML = viewWhere(S);
}
function kbars(sc){
  return Object.keys(PIL).map(pl => `<div class="pl-h" style="color:var(--${PIL[pl]})">${pl}</div>` +
    D.kids.filter(k => k.pillar === pl).map(k => { const s = sc[k.id]; const v = s.v; const low = v !== null && v < 50;
      return `<button class="kb ${low ? 'low' : ''}" data-go="${k.id}"><span class="id" style="background:var(--${PIL[pl]}s);color:var(--${PIL[pl]})">${k.id}</span>
        <span>${esc(TROW[k.id] ? TROW[k.id].name.replace(/機会がある$/,'') : k.name)}</span>
        <span class="bar"><i style="width:${v ?? 0}%;background:var(--${PIL[pl]})"></i></span>
        <span class="val">${v === null ? '—' : v}</span><span class="m">${esc(s.how)}</span></button>`; }).join('')).join('');
}
function viewAll(all, S){
  const drop = all.filter(s => s.drop).length, fol = S.filter(s => s.reasons.length).length;
  const byG = ['F','M','S','G'].map(g => { const sub = S.filter(s => s.g === g); if(!sub.length) return '';
    const ys = [...new Set(sub.map(s => s.y))].sort();
    return ys.map(y => { const t = sub.filter(s => s.y === y); return `<tr><td class="nw">${g}年次</td><td class="nw">${esc(y === '3卒' ? '３卒' : y === '4卒' ? '４卒' : y)}</td><td class="num">${t.length}</td><td style="min-width:220px">${stackBar(t)}</td>
      ${TYPES.slice(0,4).map(([n]) => `<td class="num">${pct(t, s => s.type === n)}%</td>`).join('')}</tr>`; }).join(''); }).join('');
  return `<div style="display:flex;flex-direction:column;gap:14px">
    <div class="grid">
      <div class="tile"><div class="k">集計した回答</div><div class="v">${S.length}<small> 人</small></div></div>
      <div class="tile"><div class="k">途中離脱として除外</div><div class="v">${drop}<small> 件</small></div></div>
      <div class="tile ${fol ? 'alert' : ''}"><div class="k">要フォロー</div><div class="v">${fol}<small> 人</small></div></div>
      <div class="tile"><div class="k">納得達成型</div><div class="v">${pct(S, s => s.type === '納得達成型') ?? '—'}<small> %</small></div></div>
    </div>
    <div class="two">
      <div class="panel"><h2>14の小項目（肯定的な回答の割合 %）</h2><p class="note">50未満はオレンジ。押すと「どこを強めるか」で体制一覧表の行が開きます。数値は調査からの目安で、測り方は各行の下に書いています。</p><div class="kbars">${kbars(scores(S))}</div></div>
      <div class="panel"><h2>4タイプの割合（年次別）</h2><p class="note">判定は項目一覧v8「分析ガイド」と同じ。</p>
        <div class="tbl"><table><tr><th>年次</th><th>区分</th><th>人数</th><th>内訳</th>${TYPES.slice(0,4).map(([n]) => `<th>${n}</th>`).join('')}</tr>${byG}</table></div>
        <div class="legend">${TYPES.map(([n,c]) => `<span><i style="background:${c}"></i>${n}</span>`).join('')}</div></div>
    </div></div>`;
}
function viewFollow(S){
  const L = S.filter(s => s.reasons.length).sort((a,b) => (a.g + a.q3).localeCompare(b.g + b.q3) || (+a.q4) - (+b.q4));
  return `<div class="panel"><h2>要フォロー（${L.length}人）</h2>
    <p class="note">判定：設問17⑤／設問13「誰にも話していない」。v8では「相談したい」や、気持ち・家族の世話などの困りごとは調査で拾えないので、面談・担任の観察・教育相談部との共有で補ってください。声をかけるときは「アンケートに書いてあったから」と切り出さず、面談など自然な機会に。名前が出るのはこのタブだけです。</p>
    <div class="tbl"><table><tr><th>年次</th><th>区分</th><th>クラス</th><th>番号</th><th>名前</th><th>理由</th><th>次の一歩（設問22）</th><th>タイプ</th></tr>
    ${L.map(s => `<tr><td>${esc(s.g)}</td><td>${esc(s.y)}</td><td>${esc(s.q3)}</td><td class="num">${esc(s.q4)}</td><td>${esc(s._name)}</td>
      <td>${s.reasons.map(r => `<span class="chip ${/うまく/.test(r) ? 'r' : ''}">${esc(r)}</span>`).join('')}</td><td>${esc(s.q29)}</td><td>${esc(s.type)}</td></tr>`).join('')}</table></div></div>`;
}
function viewWhere(S){
  const sc = scores(S);
  const order = D.kids.map(k => k.id).sort((a,b) => (sc[a].v ?? 101) - (sc[b].v ?? 101));
  return `<div style="display:flex;flex-direction:column;gap:12px">
    <p class="sm" style="margin:0">数値の低い順。体制一覧表 v8 の行（どの分掌が何を担っているか）と、生徒用アプリで出すコンテンツを並べています。表は「どこを見に行くか」の道案内で、原因を示すものではありません。自由記述と面談で確かめてから手を打ってください。</p>
    ${order.map(id => { const t = TROW[id] || {cells:{}}; const k = KID[id]; const v = sc[id].v;
      const cons = D.contents.filter(c => c.kids.includes(id));
      const dai = D.taisei.daicho.filter(d => d.kids.includes(id));
      return `<div class="kcard" id="k-${id}"><div><div class="sm">${id}・${esc(k.pillar)}</div><div class="score" style="color:${v !== null && v < 50 ? 'var(--low)' : `var(--${PIL[k.pillar]})`}">${v ?? '—'}</div><div class="sm">${esc(sc[id].how)}</div></div>
        <div><h3>${esc(t.name || k.name)}</h3><div class="sm">生徒の姿：${esc(t.sugata || '')}</div>
          <div class="cells">${D.taisei.bunsho.map(b => { const c = String(t.cells[b] || '').trim(); const e = !c || c === '（記入）';
            return `<div class="cell ${e ? 'empty' : ''}"><b>${esc(b)}</b>${e ? '（空欄）' : esc(c)}</div>`; }).join('')}</div>
          ${(D.taisei.taiou||[]).filter(x => x.kids.includes(id)).map(x => `<div class="hint2"><b>${esc(x.q)}</b> → ${esc(x.why)}（主に動く分掌：${esc(x.bun)}）</div>`).join('')}
          ${dai.length ? `<div class="sm" style="margin-top:8px">台帳の取り組み：${dai.map(d => `<span class="chip">${esc(d.name)}</span>`).join('')}</div>` : ''}
          <div class="sm" style="margin-top:6px">生徒用アプリのコンテンツ（${cons.length}件・公開/実施中 ${cons.filter(c => /公開|実施中/.test(c.state)).length}件）：${cons.slice(0,8).map(c => `<span class="chip" title="${esc(c.state)}">${esc(c.title)}</span>`).join('')}${cons.length > 8 ? ' ほか' : ''}</div></div></div>`; }).join('')}</div>`;
}
function viewTaisei(){
  const B = D.taisei.bunsho;
  return `<div class="panel"><h2>キャリア教育体制一覧表</h2><p class="note">元データ：マスタの「体制一覧表」シート（いま表示中：${esc(MSRC)}）。最新にするときは、右上の「マスタを読み込む」。※＝暫定配置。空欄＝まだ担う取り組みがない。</p>
    <div class="tbl mat"><table><tr><th>ID</th><th>小項目</th><th>生徒の姿</th><th>調査</th>${B.map(b => `<th>${esc(b)}</th>`).join('')}<th>充足度</th><th>次の一手</th></tr>
    ${D.taisei.rows.map(r => `<tr><td style="background:var(--${PIL[r.pillar]}s);font-weight:700">${r.id}</td><td class="h">${esc(r.name)}</td><td class="h">${esc(r.sugata)}</td><td>${esc(r.q)}</td>${B.map(b => { const v = String(r.cells[b] || '').trim(); return `<td class="${!v || v === '（記入）' ? 'emp' : ''}">${esc(v)}</td>`; }).join('')}<td>${esc(r.fill || '')}</td><td>${esc(r.next || '')}</td></tr>`).join('')}</table></div></div>`;
}
function viewDaicho(){
  return `<div class="panel"><h2>取り組み台帳（${D.taisei.daicho.length}件）</h2><p class="note">元データ：マスタの「取り組み台帳」シート。</p>
    <div class="tbl"><table><tr><th>取り組み名</th><th>担当分掌</th><th>対象年次</th><th>時期</th><th>形態</th><th>小項目</th><th>ねらい</th><th>評価の手がかり</th><th>備考</th></tr>
    ${D.taisei.daicho.map(d => `<tr><td>${esc(d.name)}</td><td>${esc(d.bun)}</td><td>${esc(d.nenji)}</td><td>${esc(d.time)}</td><td>${esc(d.form)}</td><td>${esc(d.kids.join('・'))}</td><td>${esc(d.aim)}</td><td>${esc(d.eval)}</td><td>${esc(d.note)}</td></tr>`).join('')}</table></div></div>`;
}
function viewTaiou(){
  return `<div class="panel"><h2>アンケート対応表</h2><p class="note">調査で数値が低かったとき、どの小項目・分掌を見に行くかの道案内です。原因を示すものではありません。元データ：マスタの「アンケート対応表」シート。</p>
    <div class="tbl"><table><tr><th>アンケートで見る数値</th><th>低いときに疑うこと</th><th>見直す小項目</th><th>主に動く分掌</th></tr>
    ${(D.taisei.taiou||[]).map(x => `<tr><td>${esc(x.q)}</td><td>${esc(x.why)}</td><td>${esc(x.kids.join('・'))}</td><td>${esc(x.bun)}</td></tr>`).join('')}</table></div></div>`;
}
function viewHow(){
  return `<div class="panel howto"><h2>使い方</h2><ol>
    <li>Formsで調査を締め切ったら、「応答」→「Excelで開く」でファイルを保存する。</li>
    <li>このページの「Formsの回答Excelを読み込む」で、そのファイルを選ぶ。ファイルはこのブラウザの中だけで処理され、どこにも送られない。</li>
    <li>「全体」で、年次・区分（３卒M・４卒M）・クラスを切り替えながら、14の小項目と4タイプを見る。</li>
    <li>「要フォロー」で、声をかける生徒を確かめる。対応期限と声のかけ方は、手順書v8の「配布前に決めておくこと」に従う。</li>
    <li>「どこを強めるか」で、数値の低い小項目の体制一覧表の行を見て、どの分掌の何を強めるかを話し合う。</li>
    <li>生徒には、生徒用アプリ「キャリアステップ」で同じ小項目のコンテンツが出る。足りないコンテンツはマスタの「コンテンツ」シートに足す。</li>
    <li>体制一覧表・取り組み台帳を最新にするときは、右上の「マスタを読み込む」でマスタを選ぶ（読むだけで、どこにも送られない）。</li></ol>
    <p class="sm">v8の調査（22問）では、NIERから借りた設問を削除・変更したため、全国比較はしない。A3・A4・B1は調査に項目がないので「—」と出る（項目一覧v8「分析ガイド」）。v7までの回答ファイルも読めるが、判定はv8の基準で行う。</p></div>`;
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-t]'); if(t){ TAB = t.dataset.t; draw(); return; }
  const g = e.target.closest('[data-go]'); if(g){ TAB = 'where'; draw(); const el = document.getElementById('k-' + g.dataset.go); if(el) el.scrollIntoView({behavior:'smooth', block:'start'}); }
});
document.addEventListener('change', e => { const f = e.target.dataset.f; if(f){ F[f] = e.target.value; draw(); } });
makeSample(); draw();
</script>
